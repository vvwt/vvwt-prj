# ============================================================================
# vvwt-dispatcher — application properties
# ============================================================================
# Production: override spring.datasource.* via environment variables or
# external config file. PostgreSQL driver is on the classpath (DEC-3).
# ============================================================================

spring.application.name=vvwt-dispatcher

# --- JPA ---
# ddl-auto=none in production: schema managed by schema.sql / Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Slot-optimization dispatcher ---
# Packet timeout in minutes (AC5 of E01S07, grace window in AC3 of E01S06).
# SHARED config: key rotation grace window = dispatcher.packet.timeout × 2.
# Do NOT introduce a separate grace-window knob (E01S06 AC3 explicitly forbids two knobs).
dispatcher.packet.timeout=5

# --- Logging ---
logging.level.de.vvwt=INFO
