# Test configuration — H2 in-memory database (PostgreSQL compatibility mode)
# MODE=PostgreSQL enables TIMESTAMP WITH TIME ZONE, UUID, BYTEA, and IDENTITY column support.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Hibernate creates tables — schema.sql is used as supplementary init for data
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# schema.sql applied after Hibernate create-drop: disabled to avoid conflicts with Hibernate DDL
spring.sql.init.mode=never
spring.jpa.open-in-view=false
