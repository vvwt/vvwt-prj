# vvwt-info-server — application configuration
# Story: E38S01 — DEC-42 (PPIS scaffold)
# DEC-42 D3: no-config default = self-host (drive-by-squatting mitigation)
# DEC-42 D4: profile-driven H2 (self-host) / PostgreSQL (primary)

# ---------------------------------------------------------------------------
# DEC-42 D3: default profile = self-host
# When no spring.profiles.active / SPRING_PROFILES_ACTIVE is set, Spring uses
# the 'default' profile. By setting spring.profiles.default=self-host, we
# ensure that the self-host profile (not Spring's own 'default') is activated
# on a no-config startup. AC8 asserts this.
# ---------------------------------------------------------------------------
spring:
  profiles:
    default: self-host
  # Flyway — enabled; vendor-specific + common locations per profile (E38S03)
  # Profile-specific configs (application-self-host.yml, application-primary.yml)
  # set spring.flyway.locations pointing to the correct vendor folder + common.
  # The base config does NOT define locations — profiles own them.
  flyway:
    enabled: true

# ---------------------------------------------------------------------------
# Reader endpoints — E38S06
# ---------------------------------------------------------------------------
vvwt:
  info:
    reader:
      poll-cadence-seconds: 5   # AC14: server-recommended HTTP poll cadence; sent in StreamHello
    # Rate-limit defaults are set in profile-specific configs (application-self-host.yml,
    # application-primary.yml). This block is intentionally absent here — profiles own them.
    # See E38S07 AC5, RateLimitProperties for the full property schema.

# ---------------------------------------------------------------------------
# HTTP Server — minimal scaffold (no port override yet; E38S04+ may set this)
# ---------------------------------------------------------------------------
server:
  port: ${INFO_SERVER_PORT:8090}
