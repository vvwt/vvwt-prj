# vvwt-info-server — self-host profile configuration
# Story: E38S01 — DEC-42 D3, D4
# Profile: self-host (default, no-config)
# Database: H2 embedded (DEC-42 D4, DEC-3 OSS-compliant)
# Registration mode: OPEN_FCFS, single-tenant-only (DEC-42 D3)

# ---------------------------------------------------------------------------
# Persistence — H2 embedded (DEC-42 D4)
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: "jdbc:h2:mem:vvwt-info-self-host;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  flyway:
    locations:
      - "classpath:db/migration/h2"
      - "classpath:db/migration/common"

# ---------------------------------------------------------------------------
# Application — self-host mode settings (DEC-42 D3) — E38S04 binding added
# ---------------------------------------------------------------------------
vvwt:
  info:
    registration:
      mode: OPEN_FCFS
    tenant:
      max-tenants: 1        # single-tenant-only default (drive-by-squatting mitigation DEC-42 D3)
      default-tenant-id:    # optional: pre-seed a specific tenant-id (CONFIG path of CONFIG_OR_FCFS)
    default-tenant:
      mode: CONFIG_OR_FCFS  # AC9: the correct DEC-42 D3 self-host value
    invitation-tokens: []   # OPEN_FCFS mode — invitation tokens not used

# ---------------------------------------------------------------------------
# Rate limiting — E38S07 (AC5)
# RPM values = requests-per-minute (uniform per AC5 unit-mismatch fix).
# trusted-proxies defaults to empty (security default per AC9 — XFF ignored).
# ---------------------------------------------------------------------------
    rate-limit:
      per-ip:
        publisher-rpm: 600       # 10 RPS self-host (looser — single tournament)
        reader-poll-rpm: 1200    # 20 RPS self-host
        reader-ws-rpm: 300       # 5 RPS self-host (connection-attempt rate)
      per-tournament-token:
        max-concurrent-ws: 1000  # same for self-host and primary (resource-exhaustion bound)
    trusted-proxies: []          # default-empty: XFF always ignored unless operator configures
