<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToM · Live Information</title>
    <!-- AC1, AC6 (E44S03): SVG-first favicon — yellow variant (DEC-42 D-6 / Brief D-6).
         SVG declared first for browsers that support it; PNG fallbacks in largest-to-smallest
         order per Brief Q-3 (SVG-first → PNG largest-to-smallest = browser-standard fallback). -->
    <link rel="icon" type="image/svg+xml" href="vvw-icon-yellow.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="vvw-favicon-yellow-256.png">
    <link rel="icon" type="image/png" sizes="128x128" href="vvw-favicon-yellow-128.png">
    <link rel="icon" type="image/png" sizes="64x64" href="vvw-favicon-yellow-64.png">
    <link rel="icon" type="image/png" sizes="32x32" href="vvw-favicon-yellow-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="vvw-favicon-yellow-16.png">
    <!-- AC4 (E44S03): apple-touch-icon for iOS home-screen pinning by participants.
         256px PNG used; no sizes attribute — iOS auto-scales as needed.
         Omitting sizes= avoids misleading metadata (HANDOFF ships no 180px PNG; Brief S-5
         forbids HANDOFF edits). -->
    <link rel="apple-touch-icon" href="vvw-favicon-yellow-256.png">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
