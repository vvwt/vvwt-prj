# Spring Modulith configuration — E13S01 (DEC-21)
# explicitly-annotated: only @ApplicationModule-annotated packages are treated as separate modules.
# Pre-reconstruction codebase has no @ApplicationModule annotations → verify() sees one implicit
# module and passes cleanly. Boundary enforcement activates as E14/E15 add @ApplicationModule.
# When this project reaches full bounded-context reconstruction, this property can be removed
# (or changed to 'direct-sub-packages' to revert to the strict default).
spring.modulith.detection-strategy=explicitly-annotated
