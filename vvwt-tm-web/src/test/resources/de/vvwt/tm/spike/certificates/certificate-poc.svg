<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  certificate-poc.svg — E12S01 AC1 PoC SVG template

  Representative SVG certificate template that simulates the structure of the legacy
  UrkundenVorlage. Contains the features identified in AC1:
    - Decorative gradient (linearGradient)
    - Gaussian blur filter (feGaussianBlur)
    - Base64-embedded image (data URI, replacing an external reference)
    - Mustache placeholders: {{placement}}, {{teamName}}, {{teamPhoto}}

  Font note (AC3 finding): uses "Arial" as fallback — the production template uses
  "Deutsche Uncialis Shadow" which must be installed locally on the viewing machine.
  Server-side font embedding is explicitly out of scope per story notes (D-8).

  Usage: render via jmustache with a Map containing placement, teamName, teamPhoto (base64 data URI).
-->
<svg
    version="1.1"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="297mm"
    height="210mm"
    viewBox="0 0 1122 794"
    id="certificate-poc">

  <defs>
    <!-- AC1: Decorative gradient — gold shimmer background -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#f5e642;stop-opacity:1" />
      <stop offset="40%"  style="stop-color:#e8a800;stop-opacity:1" />
      <stop offset="70%"  style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8860a;stop-opacity:1" />
    </linearGradient>

    <!-- AC1: Gaussian blur filter — decorative glow on title text -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Border gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#8B6914;stop-opacity:1" />
      <stop offset="50%"  style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background fill -->
  <rect width="1122" height="794" fill="url(#goldGradient)" opacity="0.15"/>
  <rect width="1122" height="794" fill="white" opacity="0.85"/>

  <!-- Decorative border -->
  <rect x="20" y="20" width="1082" height="754"
        fill="none" stroke="url(#borderGradient)" stroke-width="8" rx="12" ry="12"/>
  <rect x="30" y="30" width="1062" height="734"
        fill="none" stroke="#DAA520" stroke-width="2" rx="8" ry="8"/>

  <!-- Title with glow filter (AC1: Gaussian blur in use) -->
  <text x="561" y="110"
        font-family="Deutsche Uncialis Shadow, Arial, serif"
        font-size="64"
        font-weight="bold"
        text-anchor="middle"
        fill="#8B6914"
        filter="url(#glowFilter)">Urkunde</text>

  <!-- Subtitle -->
  <text x="561" y="160"
        font-family="Arial, sans-serif"
        font-size="24"
        text-anchor="middle"
        fill="#555">Volleyball-Turnier</text>

  <!-- Horizontal divider -->
  <line x1="100" y1="185" x2="1022" y2="185" stroke="#DAA520" stroke-width="2"/>

  <!-- Placement (AC1: Mustache placeholder {{placement}}) -->
  <text x="561" y="280"
        font-family="Deutsche Uncialis Shadow, Arial, serif"
        font-size="96"
        font-weight="bold"
        text-anchor="middle"
        fill="#8B6914">{{placement}}</text>

  <!-- Congratulatory text -->
  <text x="561" y="350"
        font-family="Arial, sans-serif"
        font-size="22"
        text-anchor="middle"
        fill="#333">belegte den</text>

  <!-- Team name (AC1: Mustache placeholder {{teamName}}) -->
  <text x="561" y="430"
        font-family="Deutsche Uncialis Shadow, Arial, serif"
        font-size="48"
        font-weight="bold"
        text-anchor="middle"
        fill="#4a3000">{{teamName}}</text>

  <!-- AC1: Base64-embedded team photo (Mustache placeholder {{teamPhoto}} = data URI) -->
  <!-- When {{teamPhoto}} is a base64 data URI, this renders an embedded image.
       External references (xlink:href="man1.jpg") are replaced with data URIs per spike requirements. -->
  <image
      x="461" y="470"
      width="200" height="160"
      preserveAspectRatio="xMidYMid meet"
      href="{{teamPhoto}}"
      xlink:href="{{teamPhoto}}"
      clip-path="url(#photoClip)"/>

  <!-- Signature line -->
  <line x1="200" y1="720" x2="500" y2="720" stroke="#8B6914" stroke-width="1.5"/>
  <text x="350" y="740"
        font-family="Arial, sans-serif"
        font-size="14"
        text-anchor="middle"
        fill="#666">Datum / Unterschrift</text>

  <!-- Decorative corner ornaments -->
  <text x="60"  y="780" font-size="28" fill="#DAA520" opacity="0.6">&#x2726;</text>
  <text x="1042" y="780" font-size="28" fill="#DAA520" opacity="0.6" text-anchor="end">&#x2726;</text>
  <text x="60"  y="60"  font-size="28" fill="#DAA520" opacity="0.6">&#x2726;</text>
  <text x="1042" y="60"  font-size="28" fill="#DAA520" opacity="0.6" text-anchor="end">&#x2726;</text>

</svg>
