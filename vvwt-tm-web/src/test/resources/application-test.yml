# Test profile overrides — E02S02 (amended by E16S02)
# E02S02: Replaces file-based H2 with in-memory H2 for test isolation.
# E16S02: Replaced the shared "testdb" hard-coded URL with generate-unique-name=true.
# Rationale: the explicit jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1 URL kept a single H2
# instance alive for the JVM lifetime, causing ordering-dependent Flyway collision
# flakiness when multiple @SpringBootTest classes loaded the "test" profile in the
# same mvn verify run (CrossTenantIsolationTest errored mid-E21S05, self-masked after
# E21S07 due to Surefire class-order shift). With generate-unique-name=true, Spring
# Boot generates a UUID-based H2 database name for each ApplicationContext load —
# independent contexts cannot share schema state. DEC-14: remains H2 in-memory.
spring:
  datasource:
    generate-unique-name: true
    url:  # override production file-based URL; generate-unique-name=true provides the unique H2 name
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: false

  # E05S02: allow TestAdminCredentials @Primary bean to override AdminCredentialsBootstrap's
  # AdminCredentialsProvider bean registration in SecurityConfigIT tests.
  main:
    allow-bean-definition-overriding: true

# E16S03: Override tm.data.dir so per-tenant H2 DBs land in a fresh ephemeral temp dir
# per ApplicationContext rather than the production-default ~/.vvwt-tm/tenants/.
# Without this override, stale flyway_schema_history rows in ~/.vvwt-tm/ (e.g. phantom
# V15 = e12s04_certificate_template deleted by E23S07 under DEC-25) cause
# FlywayValidateException in tests that bootstrap PerTenantFlywayRunner.
# ${random.uuid} (Spring Boot RandomValuePropertySource) generates a unique UUID per
# Environment initialisation — bound once at context startup by @ConfigurationProperties.
# TenantDirectoryHelper.createTenantDirectory uses Files.createDirectories, so the
# UUID-named temp dir is created lazily on first tenant bootstrap, not at startup.
# Classes with @DynamicPropertySource (e.g. CrossTenantIsolationTest) override this
# value at their own finer-grained level — this global default is a safety net only.
tm:
  data:
    dir: ${java.io.tmpdir}/vvwt-tm-test-${random.uuid}
