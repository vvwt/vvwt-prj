# Tournament Manager — i18n message bundle (default locale)
# E06S02 AC10: Establishes the i18n mechanism for Mustache (scoring tablet) pages.
# Subsequent E06 stories add keys here.
# Spring Boot MessageSourceAutoConfiguration resolves this from classpath:messages.properties
# (spring.messages.basename default = "messages").
#
# All scoring-tablet (score.*) keys are prefixed with "score." for namespace isolation.

# --- Scoring tablet: hello-world page (E06S02) ---
score.hello.title=VVWT Tournament Manager — Scoring Tablet
score.hello.heading=Scoring Tablet
score.hello.description=Foundation page for the VVWT scoring tablet interface. This page confirms that Mustache rendering and the ES5 utility script are available.
score.hello.version.label=Version

# --- Scoring tablet: registration page (E06S04) ---
# AC2: page title and header
score.register.title=Scoring Tablet — Anmeldung
score.register.heading=Scoring Tablet
# AC2: waiting / registering state messages
score.register.registering=Anmeldung läuft\u2026
score.register.waiting=Warte auf Zuweisung\u2026
# AC2: PIN instruction shown after successful registration
score.register.pin.instruction=Bitte sagen Sie diese PIN dem Organisator
# AC4: polling status line shown while waiting
score.register.polling=Wird zugewiesen\u2026
# AC8: error state messages
score.register.error.registration=Anmeldung fehlgeschlagen. Bitte versuche es erneut.
score.register.error.network=Verbindungsfehler. Bitte versuche es erneut.
# AC8: retry button label
score.register.retry=Erneut versuchen
# AC9 (implicit): version label reused from hello page
score.register.version.label=Version

# --- Scoring tablet: score-entry page (E06S06) ---
# AC13: page title and header
score.field.title=Scoring Tablet — Feld
score.field.heading=Scoring Tablet
# AC4: field number label
score.field.field.label=Feld
# AC9: no active match state
score.field.no.match=Kein aktives Spiel auf diesem Feld
# AC3: match display labels
score.field.lap.label=Runde
score.field.set.label=Satz
score.field.vs.label=vs.
score.field.referee.label=Schiedsrichter
# AC3: team column labels
score.field.team1.label=Team 1
score.field.team2.label=Team 2
# AC4: point button labels
score.field.plus.label=+
score.field.minus.label=-
# AC5: confirm dialog strings
score.field.confirm.heading=Satzergebnis bestätigen
score.field.confirm.prompt=Endstand für diesen Satz?
score.field.confirm.yes=Bestätigen
score.field.confirm.no=Abbrechen
# AC3, AC8: loading and error messages
score.field.loading=Spiel wird geladen\u2026
score.field.error.network=Verbindungsfehler. Bitte erneut versuchen.
score.field.error.token=Gerät nicht autorisiert. Bitte erneut anmelden.
score.field.error.forbidden=Dieses Gerät ist nicht für dieses Feld autorisiert.
score.field.error.validation=Ungültiges Ergebnis. Bitte prüfen und erneut versuchen.
score.field.submit.success=Satzergebnis gespeichert.
# AC11: score queue status
score.field.queue.pending=Speichern\u2026
score.field.queue.saved=Gespeichert.
# version label
score.field.version.label=Version
