# Tournament Manager — i18n message bundle (default locale)
# E06S02 AC10: Establishes the i18n mechanism for Mustache (scoring tablet) pages.
# Subsequent E06 stories add keys here.
# Spring Boot MessageSourceAutoConfiguration resolves this from classpath:messages.properties
# (spring.messages.basename default = "messages").
#
# All scoring-tablet (score.*) keys are prefixed with "score." for namespace isolation.

# --- Scoring tablet: hello-world page (E06S02) ---
score.hello.title=VVWT Tournament Manager — Scoring Tablet
score.hello.heading=Scoring Tablet
score.hello.description=Foundation page for the VVWT scoring tablet interface. This page confirms that Mustache rendering and the ES5 utility script are available.
score.hello.version.label=Version

# --- Scoring tablet: registration page (E06S04) ---
# AC2: page title and header
score.register.title=Scoring Tablet — Anmeldung
score.register.heading=Scoring Tablet
# AC2: waiting / registering state messages
score.register.registering=Anmeldung l\u00e4uft\u2026
score.register.waiting=Warte auf Zuweisung\u2026
# AC2: PIN instruction shown after successful registration
score.register.pin.instruction=Bitte sagen Sie diese PIN dem Organisator
# AC4: polling status line shown while waiting
score.register.polling=Wird zugewiesen\u2026
# AC8: error state messages
score.register.error.registration=Anmeldung fehlgeschlagen. Bitte versuche es erneut.
score.register.error.network=Verbindungsfehler. Bitte versuche es erneut.
# AC8: retry button label
score.register.retry=Erneut versuchen
# AC9 (implicit): version label reused from hello page
score.register.version.label=Version

# --- Scoring tablet: score-entry page (E06S06) ---
# AC13: page title and header
score.field.title=Scoring Tablet — Feld
score.field.heading=Scoring Tablet
# AC4: field number label
score.field.field.label=Feld
# AC9: no active match state
score.field.no.match=Kein aktives Spiel auf diesem Feld
# AC3: match display labels
score.field.lap.label=Runde
score.field.set.label=Satz
score.field.vs.label=vs.
score.field.referee.label=Schiedsrichter
# AC3: team column labels
score.field.team1.label=Team 1
score.field.team2.label=Team 2
# AC4: point button labels
score.field.plus.label=+
score.field.minus.label=-
# AC5: confirm dialog strings
score.field.confirm.heading=Satzergebnis best\u00e4tigen
score.field.confirm.prompt=Endstand f\u00fcr diesen Satz?
score.field.confirm.yes=Best\u00e4tigen
score.field.confirm.no=Abbrechen
# AC3, AC8: loading and error messages
score.field.loading=Spiel wird geladen\u2026
score.field.error.network=Verbindungsfehler. Bitte erneut versuchen.
score.field.error.token=Ger\u00e4t nicht autorisiert. Bitte erneut anmelden.
score.field.error.forbidden=Dieses Ger\u00e4t ist nicht f\u00fcr dieses Feld autorisiert.
score.field.error.validation=Ung\u00fcltiges Ergebnis. Bitte pr\u00fcfen und erneut versuchen.
score.field.submit.success=Satzergebnis gespeichert.
# AC11: score queue status
score.field.queue.pending=Speichern\u2026
score.field.queue.saved=Gespeichert.
# version label
score.field.version.label=Version

# --- Print routes (E08S07) ---
# AC8: i18n strings for all print pages. German default per E05 conventions.
# Namespace: print.*

# Print header partial (print-header.mustache)
print.header.tournamentLabel=Turnier
print.header.dateLabel=Datum
print.header.phaseLabel=Phase
print.header.unnamedTournament=Unbenanntes Turnier

# Print index page (/print/{tournamentId})
print.index.title=VVWT Turniermanager — Druckansicht
print.index.heading=Druckdokumente
print.index.laufzettel.link=Spielplan (Laufzettel)
print.index.fotos.link=Mannschaftsfoto-Zeitplan

# Print error page (tournament has no phases / draft not applied)
print.error.title=VVWT Turniermanager — Drucken nicht m\u00f6glich
print.error.heading=Drucken nicht m\u00f6glich
print.error.nophase=Der Spielplan wurde noch nicht erstellt. Bitte wenden Sie zuerst den Entwurf im Administrationsbereich an, bevor Sie drucken.

# --- Display device: REST API error keys (E07S02 AC9) ---
# AC2: device registration limit exceeded (HTTP 429)
error.device.limitExceeded=Ger\u00e4teregistrierung nicht m\u00f6glich: Die maximale Anzahl an Display-Ger\u00e4ten wurde erreicht.
# AC4: configure endpoint called on non-DISPLAY device (HTTP 400)
error.device.typeNotSupported=Diese Operation ist nur f\u00fcr Display-Ger\u00e4te verf\u00fcgbar.

# --- Activity type validation error keys (E08S02 AC8) ---
# AC4: unrecognized assignment rule — {0}=submitted value, {1}=comma-separated valid values
error.activityType.unknownRule=Unbekannte Zuweisungsregel: {0}. G\u00fcltige Regeln: {1}.
# AC5: duplicate activity name within the same tournament
error.activityType.duplicateName=Eine Aktivit\u00e4t mit diesem Namen existiert bereits f\u00fcr dieses Turnier.
# AC6: capacity_per_round must be null or > 0
error.activityType.invalidCapacity=Kapazit\u00e4t pro Runde muss null (unbegrenzt) oder gr\u00f6\u00dfer als 0 sein.

# --- Laufzettel (team schedule) print template (E08S08) ---
# AC14: All static text on the Laufzettel sourced from translation layer. German is the default.
# Namespace: print.laufzettel.*

# Column headers
print.laufzettel.col.round=Runde
print.laufzettel.col.time=Zeit
print.laufzettel.col.activity=Aktivit\u00e4t
print.laufzettel.col.field=Feld

# Row state labels
print.laufzettel.label.referee=Schiedsrichter
print.laufzettel.label.free=Frei
print.laufzettel.label.break=Pause

# Page titles
print.laufzettel.title.single=VVWT Turniermanager \u2014 Laufzettel
print.laufzettel.title.all=VVWT Turniermanager \u2014 Alle Laufzettel

# Headings
print.laufzettel.heading.team=Laufzettel Team

# Error page: matches not generated yet (AC13)
print.laufzettel.error.nomatches.title=VVWT Turniermanager \u2014 Laufzettel
print.laufzettel.error.nomatches.heading=Spielplan nicht verf\u00fcgbar
print.laufzettel.error.nomatches.message=Die Spielpaarungen wurden noch nicht erstellt. Bitte erstellen Sie den Spielplan, bevor Sie den Laufzettel drucken.

# --- Mannschaftsfoto-Übersicht / activity schedule print template (E08S09) ---
# AC10: All static text on the activity schedule sourced from translation layer. German is the default.
# Namespace: print.activitySchedule.*

# Page title and heading suffix
print.activitySchedule.title=VVWT Turniermanager \u2014 Zeitplan
print.activitySchedule.headingSuffix=Zeitplan

# Column headers (AC3)
print.activitySchedule.col.round=Runde
print.activitySchedule.col.time=Zeit
print.activitySchedule.col.teams=Mannschaften

# Break row label (AC4)
print.activitySchedule.break=Pause

# Summary line (AC5)
print.activitySchedule.summary={totalTeams} Mannschaften, verteilt auf {totalRounds} Runden.

# Unassigned warning section (AC6)
print.activitySchedule.unassigned.title=Keine freie Runde verf\u00fcgbar

# Error page: matches not yet generated
print.activitySchedule.error.nomatches=Der Spielplan wurde noch nicht erstellt. Bitte erstellen Sie die Spielpaarungen, bevor Sie den Aktivit\u00e4tsplan drucken.

# --- Phase breaks: validation messages (E08S01 AC8) ---
# AC5: afterLapNumber out of valid range (must be >= 1 and < totalLaps in phase)
phase_break.invalid_lap_range=Ung\u00fcltige Rundenposition: after_lap_number muss \u22651 und kleiner als die Gesamtanzahl der Runden in der Phase sein.
# AC6: a break already exists at the given lap boundary
phase_break.duplicate_lap_position=An dieser Rundenposition ist bereits eine Pause eingetragen.

# --- Team photo management (E12S02 AC9) ---
# AC7: unsupported image format
error.photo.format=Nicht unterst\u00fctztes Bildformat. Es werden nur JPEG (.jpg, .jpeg) und PNG (.png) Dateien akzeptiert.
# AC7: photo file exceeds size limit
error.photo.tooLarge=Die Fotodatei ist zu gro\u00df. Die maximale Dateigr\u00f6\u00dfe betr\u00e4gt 5 MB.
# AC8: filesystem write failure
error.photo.storage=Foto konnte nicht gespeichert werden. Bitte kontaktieren Sie den Administrator.

# --- Certificate template management (E12S04 AC10) ---
# AC7: unsupported template format (must be .html or .svg)
error.certificateTemplate.format=Nicht unterst\u00fctztes Vorlagenformat. Es werden nur HTML (.html) und SVG (.svg) Dateien akzeptiert.
# AC7: template file exceeds size limit (2 MB)
error.certificateTemplate.tooLarge=Die Vorlagendatei ist zu gro\u00df. Die maximale Dateigr\u00f6\u00dfe betr\u00e4gt 2 MB.
# AC9: filesystem write failure
error.certificateTemplate.storage=Vorlage konnte nicht gespeichert werden. Bitte kontaktieren Sie den Administrator.
# Namespace: print.certificate.* (E12S06)
# AC7: no certificate template uploaded
print.certificate.error.noTemplate=Keine Urkunden-Vorlage hochgeladen. Bitte laden Sie zuerst eine Vorlage hoch.
# AC8: no standings (no matches played)
print.certificate.error.noStandings=Es sind keine Spielergebnisse vorhanden. Bitte spielen Sie zuerst die Spiele.
# AC2: single certificate HTML page title
print.certificate.title.single=VVWT Turniermanager \u2014 Urkunde
# AC4: all-certificates HTML page title
print.certificate.title.all=VVWT Turniermanager \u2014 Alle Urkunden
