# Tournament Manager V1 — application configuration
# Story: E02S02 — H2 + Spring Boot persistence wiring
# DEC-14: H2 embedded + CRUD + Flyway
# DEC-5:  no authentication required for default-tenant LAN mode
# DEC-68 (E55S15): single tm.data.dir root — all per-purpose paths derive from ${tm.data.dir}

# ---------------------------------------------------------------------------
# HTTP Server
# ---------------------------------------------------------------------------
server:
  # Override via TM_SERVER_PORT env var or -Dserver.port (AC4)
  port: ${TM_SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Persistence — H2 embedded, file-based (DEC-14)
# ---------------------------------------------------------------------------
spring:
  datasource:
    # File-based H2 database. H2 automatically appends .mv.db to the path.
    # Default: ${tm.data.dir}/db/tm.mv.db (DEC-68 clause 2)
    # Override:  export TM_DB_PATH=/your/path/tm   (no extension — H2 adds it; DEC-68 clause 3)
    # Security:  AUTO_SERVER=FALSE — no embedded TCP listener; local file only.
    # AC4, AC7, AC10
    url: "jdbc:h2:file:${TM_DB_PATH:${tm.data.dir}/db/tm};AUTO_SERVER=FALSE"
    driver-class-name: org.h2.Driver
    # sa + empty password is the H2 file-mode convention (no server to expose).
    # AC11: no secrets beyond the local H2 file mode.
    username: sa
    password:

  # ---------------------------------------------------------------------------
  # i18n — MessageSource deterministic fallback (E46S02, AC-MESSAGE-SOURCE-FALLBACK-FALSE)
  # ---------------------------------------------------------------------------
  # Path A per AC-MESSAGE-SOURCE-FALLBACK-FALSE + AC-MESSAGE-SOURCE-BASENAME-EXPLICIT:
  # Both properties are mandatory — relying on Spring Boot autoconfigured defaults is forbidden
  # (explicit declaration anchors the contract regardless of future autoconfig drift).
  # fallback-to-system-locale: false — ensures unmatched locales fall back to messages.properties
  #   (canonical DE bundle per Brief D-7) rather than the JVM system locale.
  # basename: messages — canonical bundle name; messages_de.properties intentionally absent
  #   (AC-MESSAGES-DE-NOT-SHIPPED).
  messages:
    basename: messages
    fallback-to-system-locale: false

  # ---------------------------------------------------------------------------
  # Flyway schema migration (DEC-14)
  # ---------------------------------------------------------------------------
  flyway:
    # Post-Reset (E45S05 / DEC-25): the flat DataSource has no schema to migrate.
    # PerTenantFlywayRunner is the sole schema-application path (DEC-20, DEC-21).
    # Spring Boot Flyway is disabled here to prevent recursive scan of db/migration
    # subdirs (infoportal, certificate, tenant, tournament all have V1 files —
    # enabling it would fail with "Found more than one migration with version 1").
    enabled: false

  # ---------------------------------------------------------------------------
  # Multipart upload limits — audio file upload (E11S01 AC7)
  # Default: 10 MB max file and request size.
  # Override via TM_AUDIO_MAX_FILE_SIZE env var or -Dspring.servlet.multipart.max-file-size.
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: ${TM_AUDIO_MAX_FILE_SIZE:10MB}
      max-request-size: ${TM_AUDIO_MAX_FILE_SIZE:10MB}

# ---------------------------------------------------------------------------
# Device registration limits (E07S02 AC2)
# ---------------------------------------------------------------------------
vvwt:
  devices:
    # Maximum DISPLAY devices per tenant+location. 0 = disabled. Override via -Dvvwt.devices.max-display-count.
    max-display-count: 10

# ---------------------------------------------------------------------------
# Tournament Manager configuration (DEC-68 / E55S15 — single tm.data.dir root)
# ---------------------------------------------------------------------------
tm:
  # ---------------------------------------------------------------------------
  # DEC-68 (E55S15) — Single filesystem root for all Tournament Manager data.
  # All per-purpose path defaults below derive from this root via placeholder-nesting.
  # Default: ~/.tournament-manager (self-descriptive, user-scoped, no admin privileges needed).
  # Override: export TM_DATA_DIR=/your/data/root
  # Per-purpose env-var overrides are retained as escape hatches (DEC-68 clause 3).
  # ---------------------------------------------------------------------------
  data:
    dir: ${TM_DATA_DIR:${user.home}/.tournament-manager}
  # ---------------------------------------------------------------------------
  # Audit log file storage (E55S13)
  # DEC-15: files stored outside the jlink archive in a user-writable data directory.
  # DEC-14 2026-05-14 amendment: audit_log moved from H2 to per-tournament JSONL files.
  # Layout: <data-dir>/tenants/<tenant>/audit-log/<tournament-id>/audit.jsonl
  # Default: ${tm.data.dir} — the audit-log co-inhabits tenants/<uuid>/ alongside per-tenant DBs
  #          (DEC-68 clause 2; re-rooted from ~/.vvwt-tm by E55S15).
  # Override: export TM_AUDIT_LOG_DATA_DIR=/your/path or -Dtm.audit-log.data-dir=/your/path
  # ---------------------------------------------------------------------------
  audit-log:
    data-dir: ${TM_AUDIT_LOG_DATA_DIR:${tm.data.dir}}
  # ---------------------------------------------------------------------------
  # Audio file storage (E11S01)
  # DEC-15: files stored outside the jlink archive in a user-writable data directory.
  # Default: ${tm.data.dir}/audio (DEC-68 clause 2)
  # Override: export TM_AUDIO_DATA_DIR=/your/path or -Dtm.audio.data-dir=/your/path
  # ---------------------------------------------------------------------------
  audio:
    data-dir: ${TM_AUDIO_DATA_DIR:${tm.data.dir}/audio}
  # ---------------------------------------------------------------------------
  # Team photo storage (E12S02)
  # DEC-15: files stored outside the jlink archive in a user-writable data directory.
  # Default: ${tm.data.dir}/photos (DEC-68 clause 2)
  # Override: export TM_PHOTOS_DATA_DIR=/your/path or -Dtm.photos.data-dir=/your/path
  # Max upload size enforced at service layer (5 MB default per AC7).
  # ---------------------------------------------------------------------------
  photos:
    data-dir: ${TM_PHOTOS_DATA_DIR:${tm.data.dir}/photos}
    max-size-bytes: ${TM_PHOTOS_MAX_SIZE_BYTES:5242880}
  # ---------------------------------------------------------------------------
  # Certificate template storage (E12S04)
  # DEC-15: files stored outside the jlink archive in a user-writable data directory.
  # Default: ${tm.data.dir}/certificate-templates (DEC-68 clause 2)
  # Override: export TM_CERT_TEMPLATES_DATA_DIR=/your/path or
  #           -Dtm.certificate-templates.data-dir=/your/path
  # Max upload size: 2 MB per AC7. Override via -Dtm.certificate-templates.max-size-bytes.
  # ---------------------------------------------------------------------------
  certificate-templates:
    data-dir: ${TM_CERT_TEMPLATES_DATA_DIR:${tm.data.dir}/certificate-templates}
    max-size-bytes: ${TM_CERT_TEMPLATES_MAX_SIZE_BYTES:2097152}
  # ---------------------------------------------------------------------------
  # First-boot default-tenant bootstrap parameters (E46S05)
  # These properties are evaluated ONLY on the FIRST boot (empty registry).
  # On subsequent boots the existing registry entry is preserved as-is — re-configuring these
  # properties after first boot has NO effect (AC-FIRST-BOOT-ONLY-PROPERTY-EVALUATION).
  #
  #   display-name — human-readable label for the default tenant
  #     Default: "ToM Tournament Manager (LAN)"
  #     Override: export TM_BOOTSTRAP_DEFAULT_TENANT_DISPLAY_NAME=... or
  #               -Dtm.bootstrap.default-tenant.display-name=...
  #
  #   language — ISO 639-1 language tag for the default tenant's locale (E46S02 LocaleResolver)
  #     Default: "de" (system default per Brief C-15)
  #     Override: export TM_BOOTSTRAP_DEFAULT_TENANT_LANGUAGE=... or
  #               -Dtm.bootstrap.default-tenant.language=...
  # ---------------------------------------------------------------------------
  bootstrap:
    default-tenant:
      display-name: ${TM_BOOTSTRAP_DEFAULT_TENANT_DISPLAY_NAME:ToM Tournament Manager (LAN)}
      language: ${TM_BOOTSTRAP_DEFAULT_TENANT_LANGUAGE:de}
  slotopt:
    fallback:
      # Number of courts (fields) available per lap for slot assignment.
      # Used by PhaseToRawPhaseDefMapper and FallbackSlotOptimizationClient.
      # Override via TM_SLOTOPT_FIELDCOUNT env var or -Dtm.slotopt.fallback.field-count.
      field-count: ${TM_SLOTOPT_FIELDCOUNT:3}
    # Maximum N (team count) for exhaustive slot-optimization (DirectSlotOptimizationClient, E04S03 AC6).
    # For N <= exhaustive-max-n: all N! permutations are evaluated (guaranteed global optimum).
    # For N > exhaustive-max-n: timeout-based mode (E04S04) is used (not yet implemented — throws UOE).
    # 10! = 3,628,800 permutations. At ~300 ns/perm (E01S12 benchmark), this takes ~1 s.
    # Override via -Dtm.slotopt.exhaustive-max-n or in application-*.yml per environment.
    exhaustive-max-n: 10
    dispatcher:
      # Dispatcher base URL for Leg 2 slot-optimization routing (E27S03, DEC-49 D-3).
      # If null (default), dispatcher Leg 2 is disabled — all N>exhaustive-max-n routing uses
      # Leg 3 in-process cancelable timeout (AC-DISPATCHER-URL-CONFIG, AC-REACHABILITY-NULL-URL-RETURNS-FALSE).
      # Override via TM_SLOTOPT_DISPATCHER_URL env var or -Dtm.slotopt.dispatcher.url.
      url: ${TM_SLOTOPT_DISPATCHER_URL:}
      # Connect + read timeout in milliseconds for the dispatcher HEAD reachability probe (E27S03).
      # Default 2000 ms (2 s) — short enough to not block the optimize() call path.
      # Override via -Dtm.slotopt.dispatcher.reachability-timeout-ms.
      reachability-timeout-ms: ${TM_SLOTOPT_DISPATCHER_REACHABILITY_TIMEOUT_MS:2000}
      # Poll timeout in milliseconds for Leg 2 dispatcher job result polling (E27S03).
      # Default 300000 ms (5 minutes). On timeout, falls through to Leg 3.
      # Override via -Dtm.slotopt.dispatcher.poll-timeout-ms.
      poll-timeout-ms: ${TM_SLOTOPT_DISPATCHER_POLL_TIMEOUT_MS:300000}
      # Directory for TM worker keypair (Ed25519) used for dispatcher registration (E27S03, DEC-6).
      # Default: ${tm.data.dir}/slotopt-keys (DEC-68 clause 2)
      # Override via TM_SLOTOPT_WORKER_KEY_DIR env var or -Dtm.slotopt.dispatcher.worker-key-dir.
      worker-key-dir: ${TM_SLOTOPT_WORKER_KEY_DIR:${tm.data.dir}/slotopt-keys}
    # ---------------------------------------------------------------------------
    # E63S03/E63S04 — Embedded slot-optimization worker (opt-in, OFF by default)
    # When enabled, the TM contributes compute cycles to the dispatcher's general job pool
    # from a background thread. The worker uses its OWN Ed25519 keypair (distinct from the
    # Leg-2 submitter keypair above) stored in ${tm.data.dir}/embedded-worker-keys/ (DEC-68).
    # Host-protection (E63S04): the worker auto-pauses while TM is live-scoring and applies
    # an inter-packet CPU throttle to limit its averaged CPU share (conservative defaults).
    # ---------------------------------------------------------------------------
    embedded-worker:
      # Master opt-in switch. absent or false => worker thread never starts, no keypair generated.
      # Override: export TM_SLOTOPT_EMBEDDED_WORKER_ENABLED=true or -Dtm.slotopt.embedded-worker.enabled=true
      enabled: false
      # Dispatcher base URL for the embedded worker (same dispatcher, different registration).
      # Override: export TM_SLOTOPT_EMBEDDED_WORKER_DISPATCHER_URL or -Dtm.slotopt.embedded-worker.dispatcher-url
      dispatcher-url: ${TM_SLOTOPT_EMBEDDED_WORKER_DISPATCHER_URL:}
      # Key directory for the embedded worker's OWN Ed25519 keypair (DEC-68, AC-SEC-OWN-DISTINCT-KEYPAIR).
      # Default: ${tm.data.dir}/embedded-worker-keys (separate from Leg-2 slotopt-keys).
      # Override: export TM_SLOTOPT_EMBEDDED_WORKER_KEY_DIR or -Dtm.slotopt.embedded-worker.key-dir
      key-dir: ${TM_SLOTOPT_EMBEDDED_WORKER_KEY_DIR:${tm.data.dir}/embedded-worker-keys}
      # Poll interval (ms) when no packet is available from the dispatcher (AC-ERR-NO-PACKET-IDLES-GRACEFULLY).
      poll-interval-ms: 5000
      # Maximum backoff (ms) during a sustained dispatcher outage (AC-ERR-OUTAGE-BACKOFF-NO-BUSY-LOOP).
      backoff-max-ms: 30000
      # HTTP request timeout (ms) for dispatcher API calls.
      http-timeout-ms: 10000
      # ---------------------------------------------------------------------------
      # E63S04 — Host-protection: inter-packet CPU throttle
      # After each solved packet, the worker sleeps proportionally so its averaged CPU share
      # stays within this ratio (0.25 = max 25% of host CPU).
      # Formula: sleep = solve_time * (1 / ratio - 1). Range: (0.0, 1.0]; >= 1.0 disables.
      # Conservative default: 0.25 (worker uses at most 25% of averaged CPU time).
      # The sleep is capped at backoff-max-ms. This is NOT the standalone CpuThrottle
      # (idle-poll pacing only); it is a new ratio-based inter-packet throttle (AC-GOV-INTER-PACKET-THROTTLE-IS-NEW).
      # ---------------------------------------------------------------------------
      cpu-max-ratio: 0.25
      # ---------------------------------------------------------------------------
      # E63S04 — Host-protection: live-scoring auto-pause probe check interval
      # While TM is live-scoring (HostActivityProbe returns true), the embedded worker pauses
      # between packets and rechecks the probe on this interval (ms). When live-scoring ends,
      # the worker resumes pulling (AC-TEST-AUTO-PAUSE-ON-LIVE-SCORING, AC-ERR-RESUME-AFTER-PAUSE).
      # ---------------------------------------------------------------------------
      live-scoring-pause-check-interval-ms: 1000
  # ---------------------------------------------------------------------------
  # E55S10 — Diagnostic instrumentation (default OFF per AC-SEC-NO-DEBUG-LEAK-IN-PROD)
  # Enable for operator-driven bug reproduction (see .gaai/project/contexts/artefacts/diagnose/)
  # ---------------------------------------------------------------------------
  diagnostics:
    hikari-trace: false    # Per-connection lifecycle logging (acquire/release, autoCommit, TX)
    spring-tx-trace: false # Spring TX-boundary logging (thread, TX-name, COMMITTED/ROLLED_BACK)
  # ---------------------------------------------------------------------------
  # E55S10 — H-1 stopgap: single-writer-per-tenant (default OFF)
  # Set to true to enable maximumPoolSize=1 per tenant DataSource (serializes H2 connections).
  # May impact latency for concurrent operator workflows.
  # ---------------------------------------------------------------------------
  hikari:
    single-writer-per-tenant: false
  # ---------------------------------------------------------------------------
  # E49S04 — LAN-reachable host for registration and timer QR URLs
  # Default: blank (auto-detection via DefaultLanHostDetector — enumerates local
  #   network interfaces, selects first site-local non-loopback IPv4 address).
  # Override: export TM_PUBLIC_HOST=192.168.1.42 or -Dtm.public-host=192.168.1.42
  #   Required on multi-homed hosts (Ethernet + Wi-Fi + Docker/VPN bridges) where
  #   interface-enumeration order is non-deterministic (AC-CONFIG-OVERRIDE-EFFECTIVE).
  # Blank or whitespace-only value: treated as "not set" → auto-detection used + WARN logged
  #   (AC-ERROR-INVALID-OVERRIDE-FALLBACK).
  # DEC-15/DEC-16: detection uses local interfaces only — no external network call.
  # ---------------------------------------------------------------------------
  public-host: ${TM_PUBLIC_HOST:}

# ---------------------------------------------------------------------------
# Public Info Portal publisher (E38S09)
# Feature is disabled when info-portal.url is absent (AC6 — publisher conditional on URL).
# To enable: set info-portal.url, info-portal.tenant-id, info-portal.location-id.
# Override keypair storage dir via INFO_PORTAL_KEYPAIR_DIR env var.
# ---------------------------------------------------------------------------
info-portal:
  # url: https://info.example.com  # Uncomment to enable publisher (required)
  # tenant-id: my-tenant            # Required when url is set
  # location-id: my-venue           # Required per D-2 location-id
  deprecation-warning-threshold-days: 30
  # Default: ${tm.data.dir}/info-portal-keys (DEC-68 clause 2)
  # Override via INFO_PORTAL_KEYPAIR_DIR env var.
  keypair-dir: ${INFO_PORTAL_KEYPAIR_DIR:${tm.data.dir}/info-portal-keys}

# ---------------------------------------------------------------------------
# Actuator — health endpoint (AC5)
# No authentication required — DEC-5 default-tenant LAN mode
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Show full datasource details so health endpoint includes DB status (AC5)
      show-details: always
