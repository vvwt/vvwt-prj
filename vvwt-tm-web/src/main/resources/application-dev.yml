# Development profile — extra observability for E03S05 tenant-scoped repositories (AC12)
#
# AC12: In development mode, SQL logging is enabled so every query executed by
# TenantScopedRepository subclasses is visible in the log. Since the current
# implementation uses in-memory tenant filtering (delegator pattern), the SQL
# queries themselves do not contain WHERE tenant_id = ... clauses; however, the
# SQL log shows all queries and the repository guard fires before SQL for unscoped
# calls. This logging setting lets Delivery verify that queries are reaching the DB
# only after the guard passes.
#
# Activate this profile with: -Dspring.profiles.active=dev
# or export SPRING_PROFILES_ACTIVE=dev
logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    de.vvwt.tm.domain.repo: DEBUG
